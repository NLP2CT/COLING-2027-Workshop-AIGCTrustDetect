<section id="overview" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Overview</h2>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 52em">
<p style="margin: 0; font-size: 17px; line-height: 1.7">AIGCTrustDetect hosts a three-track shared task benchmark on trustworthy AIGC detection and governance. The tracks move beyond binary labels toward fine-grained, cross-lingual and content-level evaluation.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7">The organizing team previously ran the shared tasks on LLM-generated text detection at NLPCC 2025 (Task 1) and NLPCC 2026 (Task 6), which together attracted more than 120 participating teams and resulted in six accepted system description papers, as well as the NLPCC 2026 shared task on the reliability of AI-assisted scientific reports (Task 10).</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5A616B">Want a feel for each track first? The <a href="index.html" style="font-weight: 600">Home page</a> has one interactive example per track.</p>
</div>
</section>
<section id="track1" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Track 1.</span> Multilingual LLM-Generated Text Detection</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7; max-width: 52em">This track covers eight languages and performs fine-grained classification across human-written, LLM-generated and LLM-refined texts. It evaluates the robustness and cross-lingual generalization of detection methods under real-world deployment scenarios.</p>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.55">
<tbody>
<tr style="border-top: 1px solid #CECFD1; border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Task</th><td style="padding: 12px 0">Three-way classification: human-written, LLM-generated, LLM-refined</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Languages</th><td style="padding: 12px 0">Eight languages [list TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Data</th><td style="padding: 12px 0">[TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Evaluation</th><td style="padding: 12px 0">[metric TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Registration</th><td style="padding: 12px 0"><a href="shared-tasks.html">[link TBD]</a></td></tr>
</tbody>
</table>
</div>
<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid #CECFD1; border-radius: 10px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: #F6F8FA; border-bottom: 1px solid #CECFD1">
<span style="font-size: 13.5px; font-weight: 700">Sample instance</span>

<p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 17px; line-height: 1.6">We ran the baseline twice because the first run crashed at epoch 3; the numbers below are from the second run.</p>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed #CECFD1">
<button onClick="{{toggle1}}" aria-expanded="{{exp1}}" style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1.5px solid #0156AA; background: {{btnBg1}}; color: {{btnFg1}}; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 200ms ease, color 200ms ease">{{btnLabel1}}</button>
<sc-if value="{{show1}}" hint-placeholder-val="{{false}}">
<span class="rise" style="display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px"><span style="color: #5A616B">Expected output</span><strong style="padding: 5px 12px; border-radius: 999px; background: #DCEBF8; color: #0156AA">Human-written</strong></span>
</sc-if>
</div>
<sc-if value="{{show1}}" hint-placeholder-val="{{false}}">
<p class="rise" style="margin: 0; font-size: 14px; line-height: 1.6; color: #3B414B">A specific, slightly awkward detail (a crash at epoch 3) and a plain account of what happened, with no polish added. In the real task, the same content may also appear as LLM-generated or LLM-refined text.</p>

<section id="track2" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Track 2.</span> Multilingual LLM-Generated Archaic Text Detection</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7; max-width: 52em">This track targets AI-generated texts written in classical and archaic languages, filling a gap in content governance for historical, literary and classical-style corpora.</p>

<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.55">

<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Languages</th><td style="padding: 12px 0">[TBD]</td></tr>

<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Evaluation</th><td style="padding: 12px 0">[metric TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Registration</th><td style="padding: 12px 0"><a href="shared-tasks.html">[link TBD]</a></td></tr>

落叶满空山。
独坐听泉响，

<section id="track3" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Track 3.</span> LLM-Generated Text Quality Assessment</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7; max-width: 52em">This track focuses on overstated claims and evidence–statement mismatches. Participants identify exaggerated assertions, unsupported arguments and misaligned supporting evidence within AI-generated content.</p>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.55">
<tbody>
<tr style="border-top: 1px solid #CECFD1; border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Task</th><td style="padding: 12px 0">Identify overstated claims, unsupported arguments and misaligned evidence</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Annotation</th><td style="padding: 12px 0">[scheme TBD]</td></tr>

<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Evaluation</th><td style="padding: 12px 0">[metric TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Registration</th><td style="padding: 12px 0"><a href="shared-tasks.html">[link TBD]</a></td></tr>
</tbody>
</table>
</div>
<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid #CECFD1; border-radius: 10px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: #F6F8FA; border-bottom: 1px solid #CECFD1">
<span style="font-size: 13.5px; font-weight: 700">Sample instance</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #5A616B">illustrative; official format released with the data</span>
</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">

<p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 17px; line-height: 1.7"><span>Our detector was tested on student essays from one university. </span><span>It flagged 9 of the 10 AI-written essays. </span><span style="padding: 2px 0; border-radius: 3px; background-color: {{hl3}}; text-decoration-line: {{ul3}}; text-decoration-color: #E39B1B; text-decoration-thickness: 2px; text-underline-offset: 5px; transition: background-color 300ms ease">It can therefore be trusted to police academic integrity worldwide.</span></p>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed #CECFD1">

</sc-if>
</div>

<p class="rise" style="margin: 0; font-size: 14px; line-height: 1.6; color: #3B414B">The evidence comes from one university and ten essays; the claim covers every institution in the world. That evidence–statement mismatch is what Track 3 systems should flag.</p>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: null, shown: { 1: false, 2: false, 3: false } };
  }
  renderVals() {
    const s = this.state;
    const t = (n) => () => this.setState({ menu: this.state.menu === n ? null : n });
    const menuVals = {
      callsOpen: s.menu === 'calls',
      committeeOpen: s.menu === 'committee',
      callsExpanded: s.menu === 'calls' ? 'true' : 'false',
      committeeExpanded: s.menu === 'committee' ? 'true' : 'false',
      toggleCalls: t('calls'),
      toggleCommittee: t('committee'),
      closeMenu: () => this.setState({ menu: null })
    };
    const vals = {};
    [1, 2, 3].forEach((n) => {
      const on = !!s.shown[n];
      vals['show' + n] = on;
      vals['exp' + n] = on ? 'true' : 'false';
      vals['btnLabel' + n] = on ? 'Hide expected output' : 'Show expected output';
      vals['btnBg' + n] = on ? '#FFFFFF' : '#0156AA';
      vals['btnFg' + n] = on ? '#0156AA' : '#FFFFFF';
      vals['toggle' + n] = () => {
        const next = Object.assign({}, this.state.shown);
        next[n] = !next[n];
        this.setState({ shown: next });
      };
    });
    vals.hl3 = s.shown[3] ? 'rgba(227, 155, 27, 0.25)' : 'transparent';
    vals.ul3 = s.shown[3] ? 'underline' : 'none';
    return Object.assign({}, menuVals, vals);
  }
}
AIGC.mount(Component);
</script>

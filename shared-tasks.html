<section id="overview" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Overview</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 17px; line-height: 1.7">AIGCTrustDetect hosts a three-track shared task benchmark on trustworthy AIGC detection and governance. The tracks move beyond binary labels toward fine-grained, cross-lingual and content-level evaluation.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7">The organizing team previously ran the shared tasks on LLM-generated text detection at NLPCC 2025 (Task 1) and NLPCC 2026 (Task 6), which together attracted more than 120 participating teams and resulted in six accepted system description papers, as well as the NLPCC 2026 shared task on the reliability of AI-assisted scientific reports (Task 10).</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5A616B">Want a feel for each track first? The <a href="./" style="font-weight: 600">Home page</a> has one interactive example per track.</p>
</div>
</section>
<section id="track1" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Task 1.</span> Multilingual LLM-Generated Text Detection</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7">Participants will classify each input text as human-written, LLM-generated or LLM-refined. The LLM-refined category makes this a fine-grained three-way task: systems must distinguish text revised using an LLM from both human-written text and fully LLM-generated text. Systems will be evaluated on test data across all eight languages, with emphasis on classification performance and robustness.</p>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.55">
<tbody>
<tr style="border-top: 1px solid #CECFD1; border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Task</th><td style="padding: 12px 0">Three-way classification: human-written, LLM-generated, LLM-refined</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Languages</th><td style="padding: 12px 0">Arabic, Russian, Chinese, German, French, Spanish, Portuguese and English</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Data</th><td style="padding: 12px 0">[TBD]</td></tr>

<section id="track2" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Task 2.</span> Multilingual LLM-Generated Archaic Text Detection</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7">Participants will detect LLM-generated text in classical and archaic languages. The task evaluates how well detection methods handle linguistic conventions and resource conditions that differ substantially from those of modern languages.</p>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.55">
<tbody>
<tr style="border-top: 1px solid #CECFD1; border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Task</th><td style="padding: 12px 0">Detection of AI-generated text in classical and archaic languages [label set TBD]</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Languages</th><td style="padding: 12px 0">Latin, Ancient Greek, Old Arabic, Sanskrit and Classical Chinese</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Data</th><td style="padding: 12px 0">[TBD]</td></tr>

<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 12px 20px 12px 0; text-align: left; font-weight: 600; vertical-align: top; width: 170px">Registration</th><td style="padding: 12px 0"><a href="https://docs.google.com/forms/d/e/1FAIpQLSdShPVlYQWpoEX8dprhiZihku5k8KYZj4bxviREqb-vY2uwkg/viewform?usp=header">Register via Google Form</a><br>If Google Forms is inaccessible from mainland China, use this <a href="https://alidocs.dingtalk.com/notable/share/form/v01X3lE8GK1j1x7gOJb_LMORhxZ_HSFMwJA?source=link">alternative form</a>.</td></tr>

<section id="track3" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700"><span style="color: #0156AA">Task 3.</span> Reliability of AI-Assisted Scientific Reporting</h2>
<p style="margin: 0 0 18px; font-size: 17px; line-height: 1.7">Participants will assess whether AI-generated scientific statements faithfully reflect the experimental results or cited sources they summarize. The task covers claim-level faithfulness to experimental results and citation-level faithfulness to external evidence, including the identification of relevant supporting evidence.</p>

<p style="margin: 16px 0 0; font-size: 16px; line-height: 1.6">Registration will remain open throughout the evaluation period and will close after the results submission deadline on <strong>December 25, 2026</strong>.</p>
<p style="margin: 16px 0 0; font-size: 16px; line-height: 1.6; color: #5A616B">Dates may be adjusted by the organizers of each track as needed.</p>

<p style="margin: 0; font-size: 17px; line-height: 1.7">Participating teams are invited to submit system papers, which will be reviewed and, if accepted, presented in the shared task session at the workshop. System papers should follow the same formatting requirements and page limits as COLING 2027 main conference papers.</p>
<p style="margin: 12px 0 0; font-size: 17px; line-height: 1.7">Submit system papers through the <a href="https://openreview.net/group?id=coling-iccl.org/COLING/2027/Workshop">COLING 2027 Workshop OpenReview venue</a>.</p>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: null };
  }
  renderVals() {
    const s = this.state;
    const t = (n) => () => this.setState({ menu: this.state.menu === n ? null : n });
    const menuVals = {
      callsOpen: s.menu === 'calls',
      callsExpanded: s.menu === 'calls' ? 'true' : 'false',
      toggleCalls: t('calls'),
      closeMenu: () => this.setState({ menu: null })
    };
    return menuVals;
  }
}
AIGC.mount(Component);
</script>

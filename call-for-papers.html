<section id="overview" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Overview</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 17px; line-height: 1.7">We invite original, unpublished research on secure, explainable and robust governance of AI-generated content. AIGCTrustDetect goes beyond binary detection toward full-stack governance, and especially welcomes work with clear potential for generalization and cost-effective real-world deployment.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7">Accepted papers will be presented at the workshop, held as part of COLING 2027 in Macau.</p>
</div>
</section>
<section id="topics" style="padding-top: clamp(40px, 5vw, 60px)">
<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Topics of Interest</h2>
<p style="margin: 0 0 14px; font-size: 17px">Topics include, but are not limited to:</p>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 17px; line-height: 1.6">
<li><strong>Reliable and explainable detection.</strong> Detection methods for AI-generated text: zero-shot and supervised detectors, watermarking and provenance signals, stylometric and statistical features; interpretability, calibration and uncertainty estimation; attribution to specific models or generators; evaluation protocols, benchmarking and error analysis; decisions that humans can verify and contest.</li>
<li><strong>Detection across modalities.</strong> AI-generated content detection beyond text: speech, image, video and multimodal content, including deepfakes and synthetic media, and the transfer of detection techniques across modalities.</li>
<li><strong>Detection in complex generation scenarios.</strong> Mixed human–AI authorship and LLM-refined text; paraphrasing, translation and other obfuscation; adversarial attacks on detectors and deliberate evasion; robustness and generalization across models, domains, prompts and decoding strategies; real-time and large-scale detection systems.</li>
<li><strong>Detection and governance in agentic workflows.</strong> Content produced by LLM agents and tool-using systems: provenance and audit trails across multi-step generation, detection and attribution of AI-generated code, reliability of agent-written reports, and human oversight of automated content pipelines.</li>
<li><strong>Cross-lingual generalization.</strong> Multilingual and cross-lingual detection; transfer and low-cost adaptation to low-resource languages; language-agnostic signals; multilingual datasets and benchmarks.</li>
<li><strong>Linguistic perspectives on AI-generated text.</strong> Syntactic, semantic, discourse and pragmatic signatures of machine writing; corpus-based and stylometric comparison of human and machine text; register, genre and stylistic variation across languages; linguistic typology and its implications for detection; and human perception of AI-generated language.</li>
<li><strong>Hallucination, reliability assessment and factuality verification.</strong> Whether generated content is accurate, supported and proportionate: hallucination detection, evidence grounding and claim verification, evidence–statement mismatch and overclaim, fake news and misinformation, reliability assessment of generated text, and grounding and citation fidelity in retrieval-augmented generation.</li>
<li><strong>AI assistance in scholarly writing and peer review.</strong> Detection and disclosure of AI-generated manuscripts and reviews, reliability of LLM-as-a-judge evaluation, and governance of AI assistance across the research pipeline.</li>
<li><strong>Hierarchical and differentiated governance.</strong> Governance itself as a research problem: tiered frameworks and new tasks that formalize proportionate response across settings with different stakes, from education to journalism to content platforms; disclosure, provenance standards and policy; fairness and disparate impact of detectors, safeguards against false accusation; ethical, legal and societal implications of AI-generated content.</li>
<li><strong>Synthetic data and training-set governance.</strong> Detection and labeling of AI-generated content in training corpora, reliability of synthetic data, contamination and deduplication, and implications of recursive training for future detectors.</li>
<li><strong>Datasets, resources and tooling.</strong> Corpora, benchmarks, evaluation tools and open-source infrastructure supporting any of the directions above.</li>
</ul>
</section>

<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Submission</h2>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.6">
<tbody>
<tr style="border-top: 1px solid #CECFD1; border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Paper categories and page limits</th><td style="padding: 14px 0"><strong>Long papers:</strong> up to 8 pages of content.<br><strong>Short papers:</strong> up to 4 pages of content.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Formatting</th><td style="padding: 14px 0">PDF using the <a href="https://github.com/acl-org/acl-style-files">official ACL template</a> in review mode, following the ACL two-column A4 format, the <a href="https://aclrollingreview.org/cfp">ACL/ARR requirements</a>, and the <a href="https://acl-org.github.io/ACLPUB/formatting.html">ACL formatting guidelines</a>.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Anonymity and review</th><td style="padding: 14px 0">Double-anonymous review. Anonymize the paper, supplementary materials, and linked artifacts in accordance with the <a href="https://aclrollingreview.org/cfp#instructions-for-two-way-anonymized-review">ARR policy</a>.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">ARR commitments</th><td style="padding: 14px 0">Commitments must include completed ARR reviews and a meta-review and satisfy the current ARR commitment requirements. Papers must no longer be under ARR review. Authors submitting to ARR must also follow its current profile, reviewing-service, and submission policies.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Required section and checklist</th><td style="padding: 14px 0">Include a Limitations section and complete the <a href="https://aclrollingreview.org/responsibleNLPresearch/">Responsible NLP Research Checklist</a> with the submission.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Publication options</th><td style="padding: 14px 0">Archival and non-archival. See the <a href="#non-archival-option">Non-Archival Option</a> below.</td></tr>
<tr style="border-bottom: 1px solid #CECFD1"><th scope="row" style="padding: 14px 20px 14px 0; text-align: left; font-weight: 600; vertical-align: top; width: 250px">Presentation and attendance</th><td style="padding: 14px 0">Hybrid: in person and online.</td></tr>
</tbody>
</table>
</div>
<p style="margin: 18px 0; font-size: 17px; line-height: 1.7">Direct submissions and ARR commitments are handled through the <a href="https://openreview.net/group?id=coling-iccl.org/COLING/2027/Workshop"><strong>COLING 2027 Workshop OpenReview venue</strong></a>. Please select the appropriate submission or commitment form. Each paper receives <strong>at least two reviews from Program Committee members</strong>, and final acceptance decisions are made by <strong>Senior Program Committee members</strong>.</p>
<div id="non-archival-option">
<h3 style="margin: 24px 0 10px; font-size: 21px; font-weight: 700">Non-Archival Option</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.7">Workshops are traditionally archival. To allow dual submission of work, we also include a non-archival track. If accepted, these submissions will still participate and present their work in the workshop. A reference to the paper will be hosted on the workshop website if desired, but the paper will not be included in the official workshop proceedings. Please submit through OpenReview and indicate that this is a cross-submission at the bottom of the submission form. You can also skip this step and inform us of your non-archival preference after the reviews.</p>
</div>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.7"><strong>Archival submissions</strong> must report original, unpublished work that is not under review elsewhere. The <strong>non-archival option</strong> permits dual submission; authors must comply with the policies of any other venue involved. All accepted submissions, whether archival or non-archival, will be presented as <strong>talks and/or posters</strong> at the workshop. Only archival papers will be <strong>included in the workshop proceedings</strong>.</p>
</section>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: null, picks: [], tab: 'main' };
  }
  renderVals() {
    const s = this.state;
    const t = (n) => () => this.setState({ menu: this.state.menu === n ? null : n });
    const menuVals = {
      callsOpen: s.menu === 'calls',
      callsExpanded: s.menu === 'calls' ? 'true' : 'false',
      toggleCalls: t('calls'),
      closeMenu: () => this.setState({ menu: null })
    };
    const tabVals = {
      mainTab: s.tab === 'main',
      sharedTab: s.tab === 'shared',
      showMain: () => this.setState({ tab: 'main' }),
      showShared: () => this.setState({ tab: 'shared' }),
      mainOn: s.tab === 'main' ? 'true' : 'false',
      sharedOn: s.tab === 'shared' ? 'true' : 'false',
      mainBg: s.tab === 'main' ? '#0156AA' : '#FFFFFF',
      mainFg: s.tab === 'main' ? '#FFFFFF' : '#0156AA',
      sharedBg: s.tab === 'shared' ? '#0156AA' : '#FFFFFF',
      sharedFg: s.tab === 'shared' ? '#FFFFFF' : '#0156AA'
    };
    const CHIPS = [
      { id: 'explain', label: 'explains why a text was flagged', dir: 'explain' },
      { id: 'robust', label: 'holds up against paraphrasing, editing or evasion', dir: 'complex' },
      { id: 'mixed', label: 'handles co-written or LLM-refined text', dir: 'complex' },
      { id: 'lang', label: 'works beyond English or in low-resource languages', dir: 'cross' },
      { id: 'policy', label: 'decides how to respond once content is flagged', dir: 'gov' },
      { id: 'deploy', label: 'adapts to different deployment settings', dir: 'gov' },
      { id: 'agent', label: 'traces content through an agent or tool pipeline', dir: 'agentic' },
      { id: 'oversight', label: 'audits or attributes AI-generated code and reports', dir: 'agentic' },
      { id: 'fact', label: 'checks whether generated content is accurate', dir: 'fact' },
      { id: 'halluc', label: 'studies hallucination or text reliability', dir: 'fact' }
    ];
    const DIRS = [
      { id: 'gov', name: 'Hierarchical and differentiated governance' },
      { id: 'agentic', name: 'Governance in agentic workflows' },
      { id: 'fact', name: 'Hallucination, reliability and factuality' },
      { id: 'cross', name: 'Cross-lingual generalization' },
      { id: 'complex', name: 'Detection in complex generation scenarios' },
      { id: 'explain', name: 'Reliable and explainable detection' }
    ];
    const TRACKS = { cross: [1, 2], complex: [1], fact: [3] };
    const TINTS = ['#F4F8FC', '#EAF2FA', '#DDEBF8', '#CFE2F5', '#C2D9F0', '#B5D1EC'];
    const picked = new Set(s.picks);
    const hit = new Set();
    CHIPS.forEach((c) => { if (picked.has(c.id)) hit.add(c.dir); });

    const chips = CHIPS.map((c) => {
      const on = picked.has(c.id);
      return {
        label: c.label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#0156AA' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#2A313C',
        border: on ? '#0156AA' : '#CECFD1',
        toggle: () => {
          const cur = new Set(this.state.picks);
          if (cur.has(c.id)) cur.delete(c.id); else cur.add(c.id);
          this.setState({ picks: Array.from(cur) });
        }
      };
    });
    const layers = DIRS.map((d, i) => {
      const on = hit.has(d.id);
      return {
        name: d.name, on: on,
        bg: on ? '#0156AA' : TINTS[i],
        fg: on ? '#FFFFFF' : '#2A313C',
        border: on ? '#0156AA' : '#A9C8E8'
      };
    });

    const n = hit.size;
    let headline = 'Pick what your work does.';
    let detail = 'The stack lights up the research directions your paper speaks to.';
    if (picked.size > 0) {
      headline = 'Your paper fits ' + n + ' of 6 directions.';
      detail = n >= 3 ? 'A full-stack paper: exactly what this workshop is for.' : 'One direction is enough to submit; papers that connect several are especially welcome.';
    }
    const nums = Array.from(new Set([].concat(...Array.from(hit).map((h) => TRACKS[h] || [])))).sort();
    let trackLine = '';
    if (nums.length === 1) trackLine = 'Track ' + nums[0];
    else if (nums.length === 2) trackLine = 'Tracks ' + nums[0] + ' and ' + nums[1];
    else if (nums.length === 3) trackLine = 'Tracks 1, 2 and 3';

    return Object.assign({}, menuVals, tabVals, {
      chips: chips,
      layers: layers,
      headline: headline,
      detail: detail,
      hasPicks: picked.size > 0,
      hasTrack: nums.length > 0,
      trackLine: trackLine,
      reset: () => this.setState({ picks: [] })
    });
  }
}
AIGC.mount(Component);
</script>

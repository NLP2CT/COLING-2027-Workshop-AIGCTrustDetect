<h2 style="margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #CECFD1; font-size: clamp(24px, 2.4vw, 30px); font-weight: 700">Join the Program Committee</h2>
<p style="margin: 0 0 16px; font-size: 17px; line-height: 1.7">We welcome researchers working in areas related to the workshop to join our Program Committee.</p>
<p style="margin: 0 0 16px; font-size: 17px; line-height: 1.7">Each reviewer will be assigned at most two papers. In the era of AI-assisted research, we aim to assign only one paper per reviewer whenever possible, reducing reviewing workload so that reviewers can provide careful, high-quality feedback.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7">If you are interested, please email your OpenReview profile link to <a href="mailto:aigctrustdetect@googlegroups.com">aigctrustdetect@googlegroups.com</a>. Applications will be reviewed by members of the organizing committee, and approved members will be listed on this page.</p>
</section>

<p style="margin: 0 0 16px; font-size: 16.5px; line-height: 1.6; color: #5A616B">Confirmed members to date, listed alphabetically. The committee will grow to more than 50 members, so that every submission receives at least two reviews from Program Committee members and no reviewer is assigned more than two papers.</p>
<p style="margin: 0 0 16px; font-size: 16.5px; line-height: 1.6; color: #5A616B">Program Committee members are required to have at least one first-author publication at ICML, ICLR, NeurIPS, a *CL venue, or another related top-tier conference or journal. Senior Program Committee members are experienced researchers in the field and make the final acceptance decisions.</p>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: null };
  }
  renderVals() {
    const s = this.state;
    const t = (n) => () => this.setState({ menu: this.state.menu === n ? null : n });
    return {
      callsOpen: s.menu === 'calls',
      callsExpanded: s.menu === 'calls' ? 'true' : 'false',
      toggleCalls: t('calls'),
      closeMenu: () => this.setState({ menu: null })
    };
  }
}
AIGC.mount(Component);

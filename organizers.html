<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: null };
  }
  renderVals() {
    const s = this.state;
    const t = (n) => () => this.setState({ menu: this.state.menu === n ? null : n });
    return {
      callsOpen: s.menu === 'calls',
      committeeOpen: s.menu === 'committee',
      callsExpanded: s.menu === 'calls' ? 'true' : 'false',
      committeeExpanded: s.menu === 'committee' ? 'true' : 'false',
      toggleCalls: t('calls'),
      toggleCommittee: t('committee'),
      closeMenu: () => this.setState({ menu: null })
    };
  }
}
AIGC.mount(Component);
</script>
